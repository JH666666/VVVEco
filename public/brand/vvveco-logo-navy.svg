<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 210" width="200" height="210">
  <!-- Key 2: right bow → upper-left tip (drawn behind Key 1) -->
  <line x1="134" y1="148" x2="50" y2="48" stroke="#143c62" stroke-width="10" stroke-linecap="butt"/>

  <!-- Key 1: left bow → upper-right tip (drawn in front at crossing) -->
  <line x1="66" y1="148" x2="150" y2="48" stroke="#143c62" stroke-width="10" stroke-linecap="butt"/>

  <!-- Right bow (Key 2 head) — drawn after shaft so it covers the lower shaft end -->
  <circle cx="150" cy="172" r="31" fill="#143c62"/>
  <circle cx="150" cy="161" r="9" fill="#f5f1ea"/>
  <circle cx="139" cy="172" r="9" fill="#f5f1ea"/>
  <circle cx="150" cy="183" r="9" fill="#f5f1ea"/>
  <circle cx="161" cy="172" r="9" fill="#f5f1ea"/>
  <circle cx="150" cy="172" r="5" fill="#f5f1ea"/>

  <!-- Left bow (Key 1 head) — drawn after shaft so it covers the lower shaft end -->
  <circle cx="50" cy="172" r="31" fill="#143c62"/>
  <circle cx="50" cy="161" r="9" fill="#f5f1ea"/>
  <circle cx="39" cy="172" r="9" fill="#f5f1ea"/>
  <circle cx="50" cy="183" r="9" fill="#f5f1ea"/>
  <circle cx="61" cy="172" r="9" fill="#f5f1ea"/>
  <circle cx="50" cy="172" r="5" fill="#f5f1ea"/>

  <!-- Key 2 tip: spear-head at upper-left -->
  <polygon points="44,53 38,34 56,43" fill="#143c62"/>

  <!-- Key 1 tip: spear-head at upper-right -->
  <polygon points="144,43 162,34 156,53" fill="#143c62"/>

  <!-- VVV Book / Shield Emblem — top centre, drawn last (on top of shafts) -->
  <path d="M100,50 L88,34 L87,20 L94,14 L100,18 L106,14 L113,20 L112,34 Z" fill="#143c62"/>
  <line x1="100" y1="16" x2="100" y2="49" stroke="#f5f1ea" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="95"  y1="22" x2="105" y2="22" stroke="#f5f1ea" stroke-width="1.5" stroke-linecap="round"/>
</svg>
