<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" width="960" height="540">
  <defs>
    <radialGradient id="dc-bg" cx="30%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1a3558"/>
      <stop offset="100%" stop-color="#090e18"/>
    </radialGradient>
    <radialGradient id="dc-glow-r" cx="85%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#bd6700" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#bd6700" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dc-glow-l" cx="8%" cy="70%" r="35%">
      <stop offset="0%" stop-color="#143c62" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#143c62" stop-opacity="0"/>
    </radialGradient>
    <filter id="dc-blur5"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="dc-blur15"><feGaussianBlur stdDeviation="15"/></filter>
    <filter id="dc-blur2"><feGaussianBlur stdDeviation="2"/></filter>
    <clipPath id="dc-clip"><rect width="960" height="540"/></clipPath>
  </defs>

  <g clip-path="url(#dc-clip)">
    <!-- Background layers -->
    <rect width="960" height="540" fill="url(#dc-bg)"/>
    <rect width="960" height="540" fill="url(#dc-glow-r)"/>
    <rect width="960" height="540" fill="url(#dc-glow-l)"/>

    <!-- Fine dot grid -->
    <pattern id="dc-dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="0.7" fill="#f5f1ea" opacity="0.12"/>
    </pattern>
    <rect width="960" height="540" fill="url(#dc-dots)"/>

    <!-- Left vertical gold bar -->
    <rect x="72" y="80" width="2" height="380" fill="#bd6700" opacity="0.5" rx="1"/>

    <!-- Left content block -->
    <!-- Category label -->
    <text x="92" y="116" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#bd6700" letter-spacing="3.5" opacity="0.9">OFFICIAL SERVER</text>

    <!-- Main logo / wordmark -->
    <text x="90" y="210" font-family="Georgia, 'Times New Roman', serif" font-size="80" font-weight="500" fill="#f5f1ea" letter-spacing="-2" opacity="0.97">VVVEco</text>

    <!-- Tagline -->
    <text x="92" y="252" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="rgba(245,241,234,0.6)" letter-spacing="0.3">Community Growth Layer of Venice AI</text>

    <!-- Divider -->
    <rect x="92" y="278" width="340" height="1" fill="rgba(245,241,234,0.1)"/>

    <!-- Channel preview list -->
    <g transform="translate(92, 300)">
      <!-- Channel items -->
      <g>
        <text x="18" y="20" font-family="Inter, Arial, sans-serif" font-size="13" fill="rgba(245,241,234,0.4)" font-weight="400">#</text>
        <text x="32" y="20" font-family="Inter, Arial, sans-serif" font-size="13" fill="rgba(245,241,234,0.55)">公告 · announcements</text>
      </g>
      <g transform="translate(0,30)">
        <text x="18" y="20" font-family="Inter, Arial, sans-serif" font-size="13" fill="rgba(245,241,234,0.4)">#</text>
        <text x="32" y="20" font-family="Inter, Arial, sans-serif" font-size="13" fill="rgba(245,241,234,0.55)">质押讨论 · staking</text>
      </g>
      <g transform="translate(0,60)">
        <text x="18" y="20" font-family="Inter, Arial, sans-serif" font-size="13" fill="rgba(245,241,234,0.4)">#</text>
        <text x="32" y="20" font-family="Inter, Arial, sans-serif" font-size="13" fill="rgba(245,241,234,0.55)">了解生态 · learn</text>
      </g>
      <g transform="translate(0,90)">
        <text x="18" y="20" font-family="Inter, Arial, sans-serif" font-size="13" fill="rgba(245,241,234,0.4)">#</text>
        <text x="32" y="20" font-family="Inter, Arial, sans-serif" font-size="13" fill="rgba(245,241,234,0.55)">全球社区 · global</text>
      </g>
    </g>

    <!-- CTA button -->
    <rect x="92" y="448" width="200" height="44" rx="22" fill="#bd6700"/>
    <text x="192" y="476" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">加入服务器</text>
    <rect x="308" y="448" width="160" height="44" rx="22" fill="none" stroke="rgba(245,241,234,0.2)" stroke-width="1.5"/>
    <text x="388" y="476" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="rgba(245,241,234,0.7)" text-anchor="middle">vvveco.io</text>

    <!-- Right: orbital visualization -->
    <g transform="translate(730, 270)">
      <!-- Orbit rings -->
      <circle cx="0" cy="0" r="220" fill="none" stroke="#f5f1ea" stroke-width="0.5" opacity="0.06"/>
      <circle cx="0" cy="0" r="165" fill="none" stroke="#f5f1ea" stroke-width="0.7" opacity="0.09"/>
      <circle cx="0" cy="0" r="110" fill="none" stroke="#bd6700" stroke-width="0.8" opacity="0.22"/>
      <circle cx="0" cy="0" r="62" fill="none" stroke="#f5f1ea" stroke-width="1" opacity="0.12"/>

      <!-- Ambient core glow -->
      <circle cx="0" cy="0" r="110" fill="#bd6700" opacity="0.07" filter="url(#dc-blur15)"/>

      <!-- Core node -->
      <circle cx="0" cy="0" r="54" fill="#0d2240"/>
      <circle cx="0" cy="0" r="54" fill="none" stroke="rgba(189,103,0,0.45)" stroke-width="1.5"/>

      <!-- Core text -->
      <text x="0" y="-6" font-family="Georgia, serif" font-size="14" font-weight="600" fill="#f5f1ea" text-anchor="middle">Venice</text>
      <text x="0" y="12" font-family="Georgia, serif" font-size="14" font-weight="600" fill="#bd6700" text-anchor="middle">AI</text>

      <!-- Orbit nodes -->
      <!-- VVV node -->
      <g transform="rotate(-60) translate(0, -110)">
        <circle cx="0" cy="0" r="20" fill="#0e2a44"/>
        <circle cx="0" cy="0" r="20" fill="none" stroke="rgba(245,241,234,0.2)" stroke-width="1"/>
        <text x="0" y="5" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="700" fill="#f5f1ea" text-anchor="middle">VVV</text>
      </g>
      <!-- DIEM node -->
      <g transform="rotate(60) translate(0, -110)">
        <circle cx="0" cy="0" r="20" fill="#0e2a44"/>
        <circle cx="0" cy="0" r="20" fill="none" stroke="rgba(245,241,234,0.2)" stroke-width="1"/>
        <text x="0" y="5" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="700" fill="#f5f1ea" text-anchor="middle">DIEM</text>
      </g>
      <!-- Community node -->
      <g transform="rotate(180) translate(0, -110)">
        <circle cx="0" cy="0" r="22" fill="#0e2a44"/>
        <circle cx="0" cy="0" r="22" fill="none" stroke="rgba(189,103,0,0.5)" stroke-width="1.5"/>
        <text x="0" y="-3" font-family="Inter, Arial, sans-serif" font-size="7" font-weight="700" fill="#bd6700" text-anchor="middle">VVVEco</text>
        <text x="0" y="9" font-family="Inter, Arial, sans-serif" font-size="7" fill="rgba(245,241,234,0.5)" text-anchor="middle">Community</text>
      </g>

      <!-- Outer ring dots -->
      <circle cx="0" cy="-165" r="4" fill="#bd6700" opacity="0.8"/>
      <circle cx="0" cy="-165" r="9" fill="#bd6700" opacity="0.15" filter="url(#dc-blur2)"/>
      <circle cx="143" cy="82" r="3" fill="#f5f1ea" opacity="0.5"/>
      <circle cx="-143" cy="82" r="3" fill="#f5f1ea" opacity="0.4"/>
    </g>

    <!-- Top-right brand watermark -->
    <text x="940" y="36" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="rgba(245,241,234,0.2)" text-anchor="end" letter-spacing="1">VVVEco · vvveco.io</text>

    <!-- Gold corner accents -->
    <polyline points="0,0 55,0" stroke="#bd6700" stroke-width="2" opacity="0.5"/>
    <polyline points="0,0 0,55" stroke="#bd6700" stroke-width="2" opacity="0.5"/>
    <polyline points="960,0 905,0" stroke="#bd6700" stroke-width="2" opacity="0.5"/>
    <polyline points="960,0 960,55" stroke="#bd6700" stroke-width="2" opacity="0.5"/>
    <polyline points="0,540 55,540" stroke="#bd6700" stroke-width="2" opacity="0.5"/>
    <polyline points="0,540 0,485" stroke="#bd6700" stroke-width="2" opacity="0.5"/>
    <polyline points="960,540 905,540" stroke="#bd6700" stroke-width="2" opacity="0.5"/>
    <polyline points="960,540 960,485" stroke="#bd6700" stroke-width="2" opacity="0.5"/>
  </g>
</svg>
