<svg viewBox="0 0 1200 628" xmlns="http://www.w3.org/2000/svg" width="1200" height="628">
  <defs>
    <radialGradient id="sb-bg" cx="62%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#183354"/>
      <stop offset="100%" stop-color="#07101e"/>
    </radialGradient>
    <radialGradient id="sb-gold-right" cx="88%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#bd6700" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#bd6700" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sb-gold-left" cx="10%" cy="75%" r="30%">
      <stop offset="0%" stop-color="#bd6700" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#bd6700" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sb-orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bd6700" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#bd6700" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#bd6700" stop-opacity="0"/>
    </radialGradient>
    <filter id="sb-blur6"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="sb-blur18"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="sb-blur2"><feGaussianBlur stdDeviation="2.5"/></filter>
    <clipPath id="sb-clip"><rect width="1200" height="628"/></clipPath>
  </defs>

  <g clip-path="url(#sb-clip)">
    <!-- Backgrounds -->
    <rect width="1200" height="628" fill="url(#sb-bg)"/>
    <rect width="1200" height="628" fill="url(#sb-gold-right)"/>
    <rect width="1200" height="628" fill="url(#sb-gold-left)"/>

    <!-- Dot grid -->
    <pattern id="sb-grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.85" fill="#f5f1ea" opacity="0.1"/>
    </pattern>
    <rect width="1200" height="628" fill="url(#sb-grid)"/>

    <!-- Right-side orbital visualization -->
    <g transform="translate(920, 314)">
      <!-- Outer rings -->
      <circle cx="0" cy="0" r="290" fill="none" stroke="#f5f1ea" stroke-width="0.5" opacity="0.05"/>
      <circle cx="0" cy="0" r="230" fill="none" stroke="#f5f1ea" stroke-width="0.6" opacity="0.08"/>
      <circle cx="0" cy="0" r="168" fill="none" stroke="#bd6700" stroke-width="0.9" opacity="0.18"/>
      <circle cx="0" cy="0" r="108" fill="none" stroke="#f5f1ea" stroke-width="0.7" opacity="0.12"/>

      <!-- Glow -->
      <circle cx="0" cy="0" r="168" fill="#bd6700" opacity="0.06" filter="url(#sb-blur18)"/>

      <!-- Core -->
      <circle cx="0" cy="0" r="90" fill="#0d2140"/>
      <circle cx="0" cy="0" r="90" fill="none" stroke="rgba(189,103,0,0.4)" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="100" fill="none" stroke="rgba(245,241,234,0.06)" stroke-width="1"/>

      <!-- Core labels -->
      <text x="0" y="-10" font-family="Georgia, serif" font-size="18" font-weight="600" fill="#f5f1ea" text-anchor="middle" opacity="0.9">Venice AI</text>
      <text x="0" y="12" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#bd6700" text-anchor="middle" letter-spacing="2">ECOSYSTEM</text>

      <!-- Orbit nodes at cardinal/diagonal positions -->
      <!-- Top node: VVV -->
      <g transform="translate(0,-168)">
        <circle cx="0" cy="0" r="26" fill="#0e2540"/>
        <circle cx="0" cy="0" r="26" fill="none" stroke="rgba(245,241,234,0.22)" stroke-width="1"/>
        <text x="0" y="5" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#f5f1ea" text-anchor="middle">VVV</text>
      </g>
      <!-- Bottom node: Community -->
      <g transform="translate(0,168)">
        <circle cx="0" cy="0" r="26" fill="#0e2540"/>
        <circle cx="0" cy="0" r="26" fill="none" stroke="rgba(189,103,0,0.45)" stroke-width="1.5"/>
        <text x="0" y="-3" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700" fill="#bd6700" text-anchor="middle">VVVEco</text>
        <text x="0" y="11" font-family="Inter,Arial,sans-serif" font-size="8" fill="rgba(245,241,234,0.45)" text-anchor="middle">Community</text>
      </g>
      <!-- Right node: DIEM -->
      <g transform="translate(168,0)">
        <circle cx="0" cy="0" r="24" fill="#0e2540"/>
        <circle cx="0" cy="0" r="24" fill="none" stroke="rgba(245,241,234,0.2)" stroke-width="1"/>
        <text x="0" y="5" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#f5f1ea" text-anchor="middle">DIEM</text>
      </g>
      <!-- Left node: Base -->
      <g transform="translate(-168,0)">
        <circle cx="0" cy="0" r="24" fill="#0e2540"/>
        <circle cx="0" cy="0" r="24" fill="none" stroke="rgba(245,241,234,0.2)" stroke-width="1"/>
        <text x="0" y="5" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="rgba(245,241,234,0.7)" text-anchor="middle">Base</text>
      </g>

      <!-- Diagonal orbit dots -->
      <circle cx="119" cy="-119" r="5" fill="#bd6700" opacity="0.9"/>
      <circle cx="119" cy="-119" r="12" fill="#bd6700" opacity="0.15" filter="url(#sb-blur2)"/>
      <circle cx="-119" cy="119" r="4" fill="#f5f1ea" opacity="0.4"/>
      <circle cx="119" cy="119" r="3.5" fill="#f5f1ea" opacity="0.35"/>
      <circle cx="-119" cy="-119" r="4" fill="#bd6700" opacity="0.6"/>

      <!-- Outer ring accent dots -->
      <circle cx="0" cy="-230" r="4" fill="#f5f1ea" opacity="0.3"/>
      <circle cx="230" cy="0" r="3.5" fill="#f5f1ea" opacity="0.25"/>
      <circle cx="0" cy="230" r="4" fill="#bd6700" opacity="0.5"/>
      <circle cx="-230" cy="0" r="3" fill="#f5f1ea" opacity="0.25"/>
    </g>

    <!-- Left content -->
    <!-- Gold vertical accent -->
    <rect x="70" y="100" width="3" height="428" fill="#bd6700" opacity="0.45" rx="1.5"/>

    <!-- Eyebrow row -->
    <g transform="translate(100, 128)">
      <rect x="0" y="-12" width="8" height="8" rx="4" fill="#bd6700" opacity="0.9"/>
      <text x="18" y="-3" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#bd6700" letter-spacing="3" opacity="0.85">VENICE AI ECOSYSTEM</text>
    </g>

    <!-- Main headline — large -->
    <text font-family="Georgia, 'Times New Roman', serif" font-weight="500" fill="#f5f1ea">
      <tspan x="98" y="220" font-size="68" letter-spacing="-1.5">推动全球</tspan>
      <tspan x="98" y="302" font-size="68" letter-spacing="-1.5">社区增长。</tspan>
    </text>

    <!-- English sub -->
    <text x="100" y="346" font-family="Georgia, serif" font-size="22" fill="rgba(245,241,234,0.55)" letter-spacing="0.3">Community Growth Layer of Venice AI</text>

    <!-- Divider -->
    <rect x="100" y="374" width="480" height="1" fill="rgba(245,241,234,0.1)"/>

    <!-- Stats row -->
    <g transform="translate(100, 400)">
      <!-- Stat 1 -->
      <text x="0" y="22" font-family="Georgia, serif" font-size="30" font-weight="500" fill="#bd6700">1%</text>
      <text x="0" y="44" font-family="Inter, Arial, sans-serif" font-size="12" fill="rgba(245,241,234,0.45)" letter-spacing="0.5">最高日收益率</text>

      <!-- Divider -->
      <rect x="90" y="0" width="1" height="52" fill="rgba(245,241,234,0.12)"/>

      <!-- Stat 2 -->
      <text x="106" y="22" font-family="Georgia, serif" font-size="30" font-weight="500" fill="#f5f1ea">V8</text>
      <text x="106" y="44" font-family="Inter, Arial, sans-serif" font-size="12" fill="rgba(245,241,234,0.45)" letter-spacing="0.5">团队等级上限</text>

      <!-- Divider -->
      <rect x="196" y="0" width="1" height="52" fill="rgba(245,241,234,0.12)"/>

      <!-- Stat 3 -->
      <text x="212" y="22" font-family="Georgia, serif" font-size="30" font-weight="500" fill="#f5f1ea">Base</text>
      <text x="212" y="44" font-family="Inter, Arial, sans-serif" font-size="12" fill="rgba(245,241,234,0.45)" letter-spacing="0.5">链上原生结算</text>
    </g>

    <!-- CTA Buttons -->
    <g transform="translate(100, 490)">
      <!-- Primary -->
      <rect x="0" y="0" width="200" height="48" rx="24" fill="#bd6700"/>
      <text x="100" y="30" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">进入质押大厅 →</text>
      <!-- Secondary -->
      <rect x="220" y="0" width="180" height="48" rx="24" fill="none" stroke="rgba(245,241,234,0.22)" stroke-width="1.5"/>
      <text x="310" y="30" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="rgba(245,241,234,0.7)" text-anchor="middle">了解生态</text>
    </g>

    <!-- Bottom domain -->
    <text x="100" y="575" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="rgba(245,241,234,0.3)" letter-spacing="1.5">VVVECO.IO · BUILT ON BASE · POWERED BY VVV</text>

    <!-- Gold bottom bar -->
    <rect x="0" y="622" width="1200" height="4" fill="#bd6700" opacity="0.5"/>
    <rect x="70" y="620" width="320" height="6" fill="#bd6700" rx="3" opacity="0.7"/>

    <!-- Top-left corner mark -->
    <polyline points="0,0 60,0" stroke="#bd6700" stroke-width="2.5" opacity="0.55"/>
    <polyline points="0,0 0,60" stroke="#bd6700" stroke-width="2.5" opacity="0.55"/>
  </g>
</svg>
