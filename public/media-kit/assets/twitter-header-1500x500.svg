<svg viewBox="0 0 1500 500" xmlns="http://www.w3.org/2000/svg" width="1500" height="500">
  <defs>
    <radialGradient id="glow1" cx="75%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#bd6700" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#bd6700" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="15%" cy="80%" r="35%">
      <stop offset="0%" stop-color="#bd6700" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#bd6700" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bd6700" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#bd6700" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur4">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="blur12">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <clipPath id="clip">
      <rect width="1500" height="500"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <!-- Background -->
    <rect width="1500" height="500" fill="#0c1e33"/>
    <rect width="1500" height="500" fill="url(#glow1)"/>
    <rect width="1500" height="500" fill="url(#glow2)"/>

    <!-- Grid pattern -->
    <g opacity="0.04" stroke="#f5f1ea" stroke-width="0.5">
      <line x1="0" y1="50" x2="1500" y2="50"/>
      <line x1="0" y1="100" x2="1500" y2="100"/>
      <line x1="0" y1="150" x2="1500" y2="150"/>
      <line x1="0" y1="200" x2="1500" y2="200"/>
      <line x1="0" y1="250" x2="1500" y2="250"/>
      <line x1="0" y1="300" x2="1500" y2="300"/>
      <line x1="0" y1="350" x2="1500" y2="350"/>
      <line x1="0" y1="400" x2="1500" y2="400"/>
      <line x1="0" y1="450" x2="1500" y2="450"/>
      <line x1="100" y1="0" x2="100" y2="500"/>
      <line x1="200" y1="0" x2="200" y2="500"/>
      <line x1="300" y1="0" x2="300" y2="500"/>
      <line x1="400" y1="0" x2="400" y2="500"/>
      <line x1="500" y1="0" x2="500" y2="500"/>
      <line x1="600" y1="0" x2="600" y2="500"/>
      <line x1="700" y1="0" x2="700" y2="500"/>
      <line x1="800" y1="0" x2="800" y2="500"/>
      <line x1="900" y1="0" x2="900" y2="500"/>
      <line x1="1000" y1="0" x2="1000" y2="500"/>
      <line x1="1100" y1="0" x2="1100" y2="500"/>
      <line x1="1200" y1="0" x2="1200" y2="500"/>
      <line x1="1300" y1="0" x2="1300" y2="500"/>
      <line x1="1400" y1="0" x2="1400" y2="500"/>
    </g>

    <!-- Right side orbit rings -->
    <g transform="translate(1250, 250)" opacity="0.12">
      <circle cx="0" cy="0" r="280" fill="none" stroke="#f5f1ea" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="200" fill="none" stroke="#f5f1ea" stroke-width="0.5"/>
      <circle cx="0" cy="0" r="130" fill="none" stroke="#bd6700" stroke-width="1"/>
    </g>

    <!-- Orbit glow core -->
    <circle cx="1250" cy="250" r="130" fill="url(#coreGlow)" filter="url(#blur12)" opacity="0.4"/>

    <!-- Orbit dots -->
    <g>
      <circle cx="1250" cy="120" r="5" fill="#bd6700" opacity="0.9"/>
      <circle cx="1250" cy="120" r="10" fill="#bd6700" opacity="0.2" filter="url(#blur4)"/>
      <circle cx="1370" cy="310" r="4" fill="#f5f1ea" opacity="0.5"/>
      <circle cx="1130" cy="340" r="3" fill="#f5f1ea" opacity="0.4"/>
      <circle cx="1050" cy="200" r="3" fill="#bd6700" opacity="0.6"/>
    </g>

    <!-- Left content -->
    <!-- Gold accent bar -->
    <rect x="80" y="152" width="3" height="200" fill="#bd6700" rx="2"/>

    <!-- Eyebrow -->
    <text x="104" y="175" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#bd6700" letter-spacing="3" opacity="0.9">BUILT ON BASE · POWERED BY VVV</text>

    <!-- Main headline -->
    <text font-family="Georgia, 'Times New Roman', serif" font-weight="500" fill="#f5f1ea">
      <tspan x="100" y="252" font-size="72" letter-spacing="-1">VVVEco</tspan>
    </text>

    <!-- Sub headline -->
    <text x="102" y="295" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#f5f1ea" opacity="0.75" letter-spacing="0.5">Community Growth Layer of Venice AI</text>

    <!-- Tag line pills -->
    <g transform="translate(102, 328)">
      <rect x="0" y="0" width="130" height="28" rx="14" fill="none" stroke="rgba(245,241,234,0.18)" stroke-width="1"/>
      <text x="65" y="19" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="rgba(245,241,234,0.65)" text-anchor="middle">Privacy-First AI</text>
      <rect x="145" y="0" width="126" height="28" rx="14" fill="none" stroke="rgba(245,241,234,0.18)" stroke-width="1"/>
      <text x="208" y="19" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="rgba(245,241,234,0.65)" text-anchor="middle">Stake · Earn · Build</text>
      <rect x="286" y="0" width="110" height="28" rx="14" fill="none" stroke="rgba(245,241,234,0.18)" stroke-width="1"/>
      <text x="341" y="19" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="rgba(245,241,234,0.65)" text-anchor="middle">Base Ecosystem</text>
    </g>

    <!-- Bottom URL -->
    <text x="103" y="440" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="rgba(245,241,234,0.4)" letter-spacing="1">vvveco.io</text>

    <!-- Gold bottom accent line -->
    <rect x="0" y="495" width="1500" height="3" fill="#bd6700" opacity="0.6"/>
    <rect x="80" y="493" width="400" height="5" fill="#bd6700" rx="2.5"/>

    <!-- Node network dots — right mid area -->
    <g opacity="0.25">
      <circle cx="850" cy="130" r="3" fill="#f5f1ea"/>
      <circle cx="920" cy="180" r="2" fill="#f5f1ea"/>
      <circle cx="880" cy="260" r="2.5" fill="#bd6700"/>
      <circle cx="950" cy="320" r="2" fill="#f5f1ea"/>
      <circle cx="820" cy="370" r="3" fill="#f5f1ea"/>
      <line x1="850" y1="130" x2="920" y2="180" stroke="#f5f1ea" stroke-width="0.5"/>
      <line x1="920" y1="180" x2="880" y2="260" stroke="#f5f1ea" stroke-width="0.5"/>
      <line x1="880" y1="260" x2="950" y2="320" stroke="#f5f1ea" stroke-width="0.5"/>
      <line x1="950" y1="320" x2="820" y2="370" stroke="#f5f1ea" stroke-width="0.5"/>
    </g>
  </g>
</svg>
